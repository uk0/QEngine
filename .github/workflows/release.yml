name: release

# Tag pushes only.  This is the one workflow allowed to produce artefacts,
# and a push to main — or to any other branch — must not reach it.
on:
  push:
    tags:
      - 'v*'

jobs:
  artefacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libssl-dev libreadline-dev
      # The gate runs here too rather than being inherited from the branch
      # build: a tag can be placed on any commit, including one no gate run
      # ever covered.
      - name: 193-test gate, both durability modes
        run: bash scripts/test-both-modes.sh
      - name: build release binaries
        run: make lib tcp_cli server_cli cluster_node
      - name: publish
        uses: actions/upload-artifact@v4
        with:
          name: tsdb-${{ github.ref_name }}-linux-x86_64
          path: |
            build/libtsdb.a
            build/tsdb-cli
            build/tsdb-server
            build/cluster/tsdb_node
          if-no-files-found: error
