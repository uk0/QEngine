# ─────────────────────────────────────────────────────────────────────────────
#  tsd.conf — tsdb daemon configuration
#
#  Default location, in order of precedence:
#     1. explicit flag:    tsdb-server --config /etc/tsd.conf
#     2. environment:      TSDB_CONFIG=/etc/tsd.conf
#     3. working-dir file: ./tsd.conf
#     4. system path:      /etc/tsd.conf
#     5. (if none of the above exists)  built-in defaults
#
#  Syntax:
#     key = value            # inline comment
#     # full-line comment    # hash also works
#     ; also full-line       # semicolons too
#     [section]              # optional section headers (flat namespace)
#
#  Values:
#     bool      : true / false / yes / no / on / off / 1 / 0
#     integer   : 0, 1, 1024, 0x100, 1k, 1m, 1g, 1t  (k/m/g/t = 1024^n)
#     duration  : 100ns, 500us, 10ms, 30s, 5m, 2h, 1d  (sum allowed: 1h30m)
#     size      : 64k, 128m, 2g  (same suffixes as integer)
#     path      : absolute or relative to this file's directory
#     list      : comma-separated values;   spaces trimmed
#     string    : bare word or "quoted"
#
#  Environment overrides:
#     Any key can be overridden by setting TSDB_<UPPER_KEY>.
#     Example:  TSDB_BIND=0.0.0.0:38090   overrides  bind = 0.0.0.0:28090
#
#  Hot-reload (SIGHUP):
#     Only options tagged [reloadable] below take effect on SIGHUP. Others
#     require a full restart.
#
#  Defaults shown in brackets. Uncomment to override.
# ─────────────────────────────────────────────────────────────────────────────


# ═════════════════════════════════════════════════════════════════════════════
#  [server] — TCP listener for client traffic (wire protocol v1)
# ═════════════════════════════════════════════════════════════════════════════

# Bind address for client connections.
#   Format: ip:port  (IPv4)  |  [ipv6]:port
# bind                  = 0.0.0.0:28090                  # [0.0.0.0:28090]

# Maximum simultaneous client connections.
#   Hit this limit and new connects get TSDB_ERR_FULL + EOF.
# max_conns             = 1024                           # [1024]

# Background worker threads that drain the write/query queue.
#   0 = one per hardware thread. Higher than cores usually hurts.
# write_workers         = 0                              # [0]

# Pre-shared token; if set, HELLO without a matching token is rejected.
#   Leave unset in trusted networks. TLS in v2.
# auth_token            =                                # [<none>]

# Deadline for a single client request (handshake/query/write).
#   After this the connection is closed with TSDB_ERR_TIMEOUT.
# request_timeout       = 30s                            # [30s]


# ═════════════════════════════════════════════════════════════════════════════
#  [storage] — Disk layout, compression, WAL
# ═════════════════════════════════════════════════════════════════════════════

# Primary data directory. Always required. Tables created before
# any data_dirs are declared land here.
data_dir                = /var/lib/tsdb                  # [/var/lib/tsdb]

# Additional data directories (multi-disk / tiered-storage).
#   Comma-separated list of absolute paths. Each path must be a writable
#   filesystem; a device per path is recommended for best I/O parallelism.
#   Placement strategy is chosen via `data_dirs_strategy` below.
# data_dirs             = /mnt/nvme0/tsdb,/mnt/nvme1/tsdb,/mnt/hdd0/tsdb

# Placement strategy for data_dirs:
#   round_robin    - rotate through the list; simple even spread.
#   least_used     - pick the dir with the lowest current bytes used
#                    (queried via statvfs at create-table time).
#   hash           - deterministic: hash(table_name) % ndirs.
# data_dirs_strategy    = least_used                     # [least_used]

# Write-ahead log sync policy:
#   fsync_on_commit   - flush+fsync on every tsdb_batch_commit
#   fsync_periodic    - fsync every `wal_sync_interval` (lower latency, at
#                       most that interval of data lost on crash)
#   none              - never fsync (benchmarks only — DO NOT ship)
# wal_policy            = fsync_periodic                 # [fsync_periodic]
# wal_sync_interval     = 1s                             # [1s]

# Block size for columnar storage.
#   8192 is L2-cache-friendly and is the default the engine was tuned for.
#   Override only for experiments; SIMD kernels assume this multiple.
# block_points          = 8192                           # [8192]

# Partition granularity used by new tables that don't explicitly choose one.
#   day   - YYYYMMDD directories  (default; best for metrics ≤ 1 year)
#   hour  - YYYYMMDDHH directories (24× finer skip; choose for hot traces)
# default_partition     = day                            # [day]

# Default compression profile applied to new tables.
#   chimp128+lz    - best ratio, higher encode cost  (recommended)
#   chimp+lz       - balanced
#   gorilla+lz     - lowest ratio, lowest encode cost (legacy)
#   raw            - no compression (debug / benchmarks only)
# default_codec         = chimp128+lz                    # [chimp128+lz]

# Maximum on-disk size per partition before it is considered "full" and
# rolled over to a new directory. 0 disables this cap.
# max_partition_bytes   = 0                              # [0 = unlimited]

# Retention horizon applied if a table doesn't specify its own.
# Partitions older than this are deleted by the retention GC.
# 0 disables retention (keep forever).
# default_retention     = 0                              # [0 = forever]

# Retention GC sweep interval. [reloadable]
# retention_sweep_every = 1h                             # [1h]


# ═════════════════════════════════════════════════════════════════════════════
#  [memtable] — In-memory write buffer
# ═════════════════════════════════════════════════════════════════════════════

# Number of write shards (power of 2). Each shard has its own mutex,
# so higher values reduce contention but cost more memory.
#   Memory cost: shards × ncols × block_points × 8B
# shards                = 16                             # [16]

# Force a flush when this many unflushed rows accumulate in a shard.
#   Smaller = better read visibility, more fsync traffic.
# flush_rows_threshold  = 8192                           # [8192 = one block]

# Force a flush after this wall-clock interval, even if not full.
# flush_interval        = 1s                             # [1s]


# ═════════════════════════════════════════════════════════════════════════════
#  [query] — Planner and executor
# ═════════════════════════════════════════════════════════════════════════════

# Parallel scan worker pool size. 0 = one per hardware thread.
#   The pool is shared across all concurrent queries.
# query_workers         = 0                              # [0]

# Enable parallel aggregate path globally. [reloadable]
# query_parallel        = true                           # [true]

# Honour the WHERE `ts >=` / `ts <=` predicates to skip whole partitions
# via the file-level zone map (IdxHeader v2). Disable only to benchmark
# the naive path. [reloadable]
# query_zone_prune      = true                           # [true]

# Honour per-block ts_min/ts_max for block-level skipping inside a
# partition. [reloadable]
# query_block_skip      = true                           # [true]

# Maximum rows a single query result may buffer before returning an error.
# Protects the server from pathological SELECT * without LIMIT.
# max_result_rows       = 10m                            # [10M = 10_000_000]


# ═════════════════════════════════════════════════════════════════════════════
#  [cluster] — Node identity, gossip, RPC, replication
# ═════════════════════════════════════════════════════════════════════════════

# Enable cluster mode. When false, the server runs standalone.
# cluster_enabled       = false                          # [false]

# This node's stable 64-bit identifier. If unset, derived from hostname+PID
# on first boot and persisted to <data_dir>/node.id.
# node_id               =                                # [auto]

# UDP gossip endpoint (SWIM-lite).
# cluster_gossip_bind   = 0.0.0.0:28080                  # [0.0.0.0:28080]

# TCP RPC endpoint (peer-to-peer). Clients do NOT use this port.
# cluster_rpc_bind      = 0.0.0.0:28081                  # [0.0.0.0:28081]

# Seed addresses (comma-separated host:port list). A single node in the
# cluster is enough; gossip discovers the rest.
# cluster_seeds         = node1:28081,node2:28081,node3:28081

# Replication factor (number of copies per shard).
# cluster_replica_factor= 3                              # [3]

# Quorum for acknowledged writes. Must be ≤ replica_factor.
# cluster_write_quorum  = 2                              # [2]

# Raw-block replication: primary ships compressed blocks to replicas
# verbatim (2.4× faster than re-encoding). Disable only for comparison.
# cluster_rawblock      = true                           # [true]

# SWIM failure detector parameters.
# gossip_interval       = 500ms                          # [500ms]
# gossip_suspect_after  = 3                              # [3 missed pings]
# gossip_dead_after     = 10s                            # [10s suspect → dead]

# Auto-balancer: adjusts per-node virtual-node count based on write EMA
# and storage bytes. Lower of either metric makes a node *shed* load;
# higher of either makes it *accept* load.
# autobalance_enabled       = true                       # [true]
# autobalance_interval      = 30s                        # [30s]
# autobalance_alpha_writes  = 0.6                        # [0.6] writes weight
# autobalance_beta_storage  = 0.4                        # [0.4] storage weight
# autobalance_dampen        = 0.5                        # [0.5] max VN move


# ═════════════════════════════════════════════════════════════════════════════
#  [federation] — Cross-cluster queries
# ═════════════════════════════════════════════════════════════════════════════

# Federation mode is entirely client-side; the server itself does not
# need to know about it. These keys are consumed by tsdb-cli and by
# applications embedding libfederation.
# fed_config            = /etc/tsd-federation.conf       # [unset]


# ═════════════════════════════════════════════════════════════════════════════
#  [logging] — Structured logs + debug
# ═════════════════════════════════════════════════════════════════════════════

# Overall verbosity. [reloadable]
#   error   : only fatal / unrecoverable
#   warn    : + expected-but-notable events (quorum fallback, etc.)
#   info    : + per-connection accepts, table creates, config loads    (default)
#   debug   : + per-query plan dump, every commit, balancer decisions
#   trace   : + raw frame hexdumps   (VERY verbose; localhost only)
# log_level             = info                           # [info]

# Where logs go.
#   stderr  : stderr of the tsdb-server process (default; captured by systemd)
#   file    : write to the path in `log_file` (see below)
#   syslog  : local syslog via openlog/LOG_DAEMON
#   both    : stderr + file
# log_sink              = stderr                         # [stderr]

# Path for the `file` / `both` sink. Rotated externally (logrotate etc.).
# log_file              = /var/log/tsdb/tsdb.log

# Log format.
#   text    : "TIME LEVEL source: message"
#   json    : {"ts":...,"lvl":...,"src":...,"msg":...,"kv":{...}}
# log_format            = text                           # [text]

# Debug feature flags. Space- or comma-separated. [reloadable]
#
#   scan_plan      - log the scan sources and zone-map skips per query
#   flush          - log every memtable flush with block counts + sizes
#   rawblock       - log every raw-block RPC in/out
#   gossip         - log every ping/ack; very noisy
#   heap_stats     - dump allocator counters every 60 s
#   slow_query     - log queries taking > slow_query_threshold
#   simd_path      - log which SIMD path was chosen on first query
#   zone_map       - log when a partition is skipped by zone map
#
# debug_flags           =                                # [<empty>]
# slow_query_threshold  = 500ms                          # [500ms]

# Write a pprof-style CPU profile to this path if set (SIGUSR1 starts/stops).
# cpu_profile_path      = /var/log/tsdb/cpu.prof


# ═════════════════════════════════════════════════════════════════════════════
#  [runtime] — Process lifecycle
# ═════════════════════════════════════════════════════════════════════════════

# Drop privileges after binding to ports.
# user                  =                                # [keep current]
# group                 =                                # [keep current]

# PID file. Deleted on clean shutdown.
# pidfile               = /var/run/tsdb.pid

# How long to wait for inflight writes/queries to drain on SIGTERM before
# forcing close.
# shutdown_grace        = 10s                            # [10s]

# Core dump policy: if `allow_core = true`, no RLIMIT_CORE change (inherits
# from the shell / unit file). If `false`, sets RLIMIT_CORE = 0.
# allow_core            = false                          # [false]


# ═════════════════════════════════════════════════════════════════════════════
#  [dev]  — Development / benchmarking toggles (REMOVE in production)
# ═════════════════════════════════════════════════════════════════════════════

# Force SIMD dispatch to a specific level. Accepts SCALAR|NEON|AVX2|AVX512.
#   The runtime auto-detects otherwise. Useful for A/B benchmark runs.
# cpu_level             =                                # [auto]

# Disable the adaptive codec selection — always use a fixed codec.
#   Values: none | dod | gorilla | chimp | chimp128 | pfor | dict | lzlite
#   Only for measuring one codec in isolation.
# force_codec           =                                # [<adaptive>]

# Synthetic delay injected into every flush / every RPC, for testing
# retry paths. Do NOT enable in production.
# fault_flush_delay     = 0                              # [0]
# fault_rpc_delay       = 0                              # [0]

# ─── end of file ───
