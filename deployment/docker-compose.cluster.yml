# docker-compose.cluster.yml — production-ready 3-node QEngine cluster.
#
# Each node runs tsdb-node (gossip + rawblock replication) AND exposes
# the wire-protocol client API + the dashboard.  Clients can hit any
# node; writes replicate to peers via the raw-block hook and reads can
# fan across replicas.
#
# Host port map:
#   node1  client 29301  dashboard 29311
#   node2  client 29302  dashboard 29312
#   node3  client 29303  dashboard 29313
#
# Internal (on the bridge network tsdb-cnet, not exposed):
#   28090 tcp — client
#   28081 tcp — cluster RPC
#   28080 udp — gossip
#
# Usage:
#   docker compose -f docker-compose.cluster.yml build
#   docker compose -f docker-compose.cluster.yml up -d
#   curl http://host:29311/cluster | python3 -m json.tool
#   curl http://host:29311/              # HTML dashboard
#
# Data persists in docker-managed named volumes (cnode{1,2,3}-data).
# To pin data onto a host path, replace the `cnodeN-data:` entry in
# the `volumes:` section with a `driver_opts` bind mount, e.g.
#   cnode1-data:
#     driver: local
#     driver_opts:
#       type: none
#       device: /mnt/ssd/tsdb/cnode1
#       o: bind
#
# --------------------------------------------------------------------
# Performance tuning knobs (applied to every node below)
# --------------------------------------------------------------------
#   TSDB_IOPOLICY=hdd
#       Optimises the I/O path for spinning disks: madvise SEQUENTIAL,
#       larger stdio write buffer, posix_fadvise on .idx reads.  On
#       NVMe/SSD this is a no-op or slight slowdown — drop it.
#
#   TSDB_REPLICA_CONNS_PER_PEER=16
#       Number of TCP connections primary → each peer.  Each connection
#       gets its own handler thread on the peer side, so N conns give
#       N-way concurrency on replication RPC.  Default 8, bump to 16
#       for write-heavy workloads on 4+ node clusters.
#
#   TSDB_WAL_ONLY_COMMIT=1  (opt-in, commented out below)
#       Batch commit only syncs the WAL; memtable drains lazily on
#       is_full().  Dramatically reduces flush count on small-batch
#       workloads but defers replication to the next flush boundary.
#       Durability is preserved via WAL replay on crash.  Uncomment
#       only if you understand the replication-latency trade-off.
# --------------------------------------------------------------------

services:

  node1:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: qengine/tsdb:dev
    container_name: qengine-cnode-1
    hostname: qengine-cnode-1
    environment:
      TSDB_ROLE:                   cluster-node
      TSDB_NODE_ROLE:              master
      TSDB_CONSENSUS:              raft
      TSDB_DASHBOARD_AUTH:         "1"
      TSDB_AUTH_SEED_BANNER:       "1"
      TSDB_DATA_DIR:               /var/lib/tsdb
      TSDB_BIND:                   0.0.0.0:28090
      # RPC + gossip advertise using the docker-network alias so peers
      # can reach this node.  Bind accepts a hostname; it resolves to
      # the container's internal network IP at runtime.
      TSDB_RPC_BIND:               qengine-cnode-1:28081
      TSDB_METRICS_BIND:           0.0.0.0:28094
      TSDB_IOPOLICY:               hdd
      # TSDB_REPLICA_CONNS_PER_PEER >1 is opt-in and currently has a known
      # UAF under sustained failure (slot eviction vs in-flight rpc_call
      # race).  Default 1 is measured stable at 3.3 M rows/s on the lvm1
      # 4-node HDD cluster and 0 write errors over 60 s.  Bump only after
      # the pool-refcount refactor lands.
      TSDB_REPLICA_CONNS_PER_PEER: "1"
      # TSDB_WAL_ONLY_COMMIT:        "1"   # opt-in, see note above
      # node1 is the seed — no TSDB_SEEDS.
    ports:
      - "29301:28090"
      - "29321:28092"
      - "29311:28094"
    volumes:
      - /home/nas/tsdb/cnode1/data:/var/lib/tsdb
    networks:
      tsdb-cnet:
        aliases: [qengine-cnode-1]
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:28094/health | grep -q ok || exit 1"]
      interval: 10s
      timeout:  3s
      retries:  5
      start_period: 5s

  node2:
    image: qengine/tsdb:dev
    container_name: qengine-cnode-2
    hostname: qengine-cnode-2
    depends_on:
      node1:
        condition: service_healthy
    environment:
      TSDB_ROLE:                   cluster-node
      TSDB_NODE_ROLE:              data
      TSDB_CONSENSUS:              raft
      TSDB_DASHBOARD_AUTH:         "1"
      TSDB_AUTH_SEED_BANNER:       "1"
      TSDB_DATA_DIR:               /var/lib/tsdb
      TSDB_BIND:                   0.0.0.0:28090
      TSDB_RPC_BIND:               qengine-cnode-2:28081
      TSDB_METRICS_BIND:           0.0.0.0:28094
      TSDB_IOPOLICY:               hdd
      # TSDB_REPLICA_CONNS_PER_PEER >1 is opt-in and currently has a known
      # UAF under sustained failure (slot eviction vs in-flight rpc_call
      # race).  Default 1 is measured stable at 3.3 M rows/s on the lvm1
      # 4-node HDD cluster and 0 write errors over 60 s.  Bump only after
      # the pool-refcount refactor lands.
      TSDB_REPLICA_CONNS_PER_PEER: "1"
      # TSDB_WAL_ONLY_COMMIT:        "1"
      # Seeds are gossip addresses (= RPC port − 1).
      TSDB_SEEDS:                  qengine-cnode-1:28080
    ports:
      - "29302:28090"
      - "29322:28092"
      - "29312:28094"
    volumes:
      - /home/nas/tsdb/cnode2/data:/var/lib/tsdb
    networks:
      tsdb-cnet:
        aliases: [qengine-cnode-2]
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:28094/health | grep -q ok || exit 1"]
      interval: 10s
      timeout:  3s
      retries:  5
      start_period: 5s

  node3:
    image: qengine/tsdb:dev
    container_name: qengine-cnode-3
    hostname: qengine-cnode-3
    depends_on:
      node1:
        condition: service_healthy
    environment:
      TSDB_ROLE:                   cluster-node
      TSDB_NODE_ROLE:              data
      TSDB_CONSENSUS:              raft
      TSDB_DASHBOARD_AUTH:         "1"
      TSDB_AUTH_SEED_BANNER:       "1"
      TSDB_DATA_DIR:               /var/lib/tsdb
      TSDB_BIND:                   0.0.0.0:28090
      TSDB_RPC_BIND:               qengine-cnode-3:28081
      TSDB_METRICS_BIND:           0.0.0.0:28094
      TSDB_IOPOLICY:               hdd
      # TSDB_REPLICA_CONNS_PER_PEER >1 is opt-in and currently has a known
      # UAF under sustained failure (slot eviction vs in-flight rpc_call
      # race).  Default 1 is measured stable at 3.3 M rows/s on the lvm1
      # 4-node HDD cluster and 0 write errors over 60 s.  Bump only after
      # the pool-refcount refactor lands.
      TSDB_REPLICA_CONNS_PER_PEER: "1"
      # TSDB_WAL_ONLY_COMMIT:        "1"
      TSDB_SEEDS:                  qengine-cnode-1:28080,qengine-cnode-2:28080
    ports:
      - "29303:28090"
      - "29323:28092"
      - "29313:28094"
    volumes:
      - /home/nas/tsdb/cnode3/data:/var/lib/tsdb
    networks:
      tsdb-cnet:
        aliases: [qengine-cnode-3]
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:28094/health | grep -q ok || exit 1"]
      interval: 10s
      timeout:  3s
      retries:  5
      start_period: 5s

networks:
  tsdb-cnet:
    driver: bridge
    name: tsdb-cnet

