# docker-compose.addnode.yml — 演示怎么往已有集群动态加入一个节点。
#
# 前提：docker-compose.cluster.yml 已起好了 3 节点 cluster (qengine-cnode-1/2/3)
# 并且 bridge network "tsdb-cnet" 已存在。
#
# 用法：
#   # 起一个新节点（4 号），seed 指向任意现有节点
#   docker compose -f docker-compose.addnode.yml up -d
#
#   # 观察集群视图会在 1-2 秒内把 node4 加进去
#   curl http://lvm1:29311/cluster | python3 -m json.tool   # 应看到 4 个 nodes
#   curl http://lvm1:29314/cluster                          # node4 自己的视图
#
#   # 撤下来
#   docker compose -f docker-compose.addnode.yml down
#
# 想要第 5、第 6 节点就 cp 这个文件改名 + 改 container_name + ports + volume。
# 生产环境里这一串由运维自动化编排（比如 Ansible / K8s StatefulSet）。

services:

  node4:
    image: qengine/tsdb:dev       # 已经由 docker-compose.cluster.yml build 好
    container_name: qengine-cnode-4
    hostname: qengine-cnode-4
    environment:
      TSDB_ROLE:          cluster-node
      TSDB_DATA_DIR:      /var/lib/tsdb
      TSDB_BIND:          0.0.0.0:28090
      TSDB_RPC_BIND:      qengine-cnode-4:28081
      TSDB_METRICS_BIND:  0.0.0.0:28094
      TSDB_IOPOLICY:      hdd
      # Seed 指向 node1 的 gossip 地址（= RPC - 1）
      TSDB_SEEDS:         qengine-cnode-1:28080
    ports:
      - "29304:28090"     # 客户端
      - "29314:28094"     # dashboard
    volumes:
      - /home/nas/tsdb/cnode4/data:/var/lib/tsdb
    networks:
      tsdb-cnet:
        aliases: [qengine-cnode-4]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:28094/health | grep -q ok || exit 1"]
      interval: 10s
      timeout:  3s
      retries:  5
      start_period: 5s

networks:
  # 复用 cluster.yml 创建的那张网络；external: true 不会再建一张。
  tsdb-cnet:
    external: true
    name: tsdb-cnet
