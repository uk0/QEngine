# docker-compose.addnode.yml — add a 4th node to an existing QEngine cluster.
#
# Prerequisite: docker-compose.cluster.yml is already running with
# nodes qengine-cnode-1/2/3 and the bridge network tsdb-cnet exists.
#
# Usage:
#   # bring a new node (4th) online, seeding off any existing node
#   docker compose -f docker-compose.addnode.yml up -d
#
#   # within 1–2 seconds gossip will include node4 in the cluster view
#   curl http://host:29311/cluster | python3 -m json.tool   # expect 4 nodes
#   curl http://host:29314/cluster                            # node4's view
#
#   # take it back down
#   docker compose -f docker-compose.addnode.yml down
#
# To add a 5th / 6th node: copy this file, change container_name,
# host-side ports, volume name, and TSDB_RPC_BIND.  The seed list
# can reference any currently-ALIVE node.  In production this is
# typically driven by Ansible / Kubernetes StatefulSet templates.

services:

  node4:
    image: qengine/tsdb:dev        # already built by docker-compose.cluster.yml
    container_name: qengine-cnode-4
    hostname: qengine-cnode-4
    environment:
      TSDB_ROLE:                   cluster-node
      TSDB_NODE_ROLE:              data
      TSDB_CONSENSUS:              raft
      TSDB_DATA_DIR:               /var/lib/tsdb
      TSDB_BIND:                   0.0.0.0:28090
      TSDB_RPC_BIND:               qengine-cnode-4:28081
      TSDB_METRICS_BIND:           0.0.0.0:28094
      TSDB_DASHBOARD_AUTH:         "1"
      TSDB_AUTH_SEED_BANNER:       "1"
      TSDB_DASHBOARD_DIR:          /etc/tsdb/dashboard/dist
      TSDB_IOPOLICY:               hdd
      # See docker-compose.cluster.yml for the rationale; keep in sync.
      TSDB_REPLICA_CONNS_PER_PEER: "1"
      # TSDB_WAL_ONLY_COMMIT:        "1"   # see note in cluster.yml
      # Seed points to node1's gossip address (= RPC port − 1).
      TSDB_SEEDS:                  qengine-cnode-1:28080
    ports:
      - "29304:28090"
      - "29324:28092"     # client
      - "29314:28094"     # dashboard
    volumes:
      - /home/nas/tsdb/cnode4/data:/var/lib/tsdb
      - /home/nas/tsdb/src/deployment/dashboard-dist:/etc/tsdb/dashboard/dist:ro
    networks:
      tsdb-cnet:
        aliases: [qengine-cnode-4]
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:28094/health | grep -q ok || exit 1"]
      interval: 10s
      timeout:  3s
      retries:  5
      start_period: 5s

networks:
  # Reuse the network created by cluster.yml; external: true means
  # compose will not create a second network.
  tsdb-cnet:
    external: true
    name: tsdb-cnet

